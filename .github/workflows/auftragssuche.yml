name: Auftragssuche
on:
  schedule:
    - cron: "17 6,10,14,18 * * *" # UTC, viermal täglich
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: auftragssuche
jobs:
  suche:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Suchen und bewerten
        run: node scripts/search.mjs
        env:
          WORKER_URL: ${{ secrets.WORKER_URL }}
          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
      - name: Ergebnis speichern
        run: |
          git config user.name "kaz-bot"
          git config user.email "kaz-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Auftragssuche: neue Daten" && git push)
